{% extends "base.html" %}

{% block content %}
<div data-screen="reveal" class="game-container max-w-4xl mx-auto rounded-2xl shadow-2xl p-4 sm:p-6 md:p-8">
    <h2 class="text-2xl sm:text-3xl font-bold text-purple-800 mb-4 sm:mb-6 text-center">
        <i class="fas fa-eye"></i> Role Assignment
    </h2>
    
    <div id="roleReveal" class="text-center">
    </div>
    
    <div class="flex flex-col sm:flex-row justify-center mt-6 gap-3 sm:gap-4">
        <button onclick="playAgain()" class="btn bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-6 rounded-lg w-full sm:w-auto">
            <i class="fas fa-redo"></i> Play Again
        </button>
        <button onclick="window.location.href='/'" class="btn bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-6 rounded-lg w-full sm:w-auto">
            <i class="fas fa-home"></i> Home
        </button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentIndex = 0;

async function playAgain() {
    // Use the saved category from settings
    const category = gameState.wordCategory !== 'custom' ? gameState.wordCategory : null;
    gameState.secretWord = await wordManager.getRandomWord(category);
    gameState.setSecretWord(gameState.secretWord);
    
    const assignedPlayers = assignRoles(gameState.players, gameState.imposterCount, gameState.jesterCount);
    gameState.setPlayers(assignedPlayers);
    currentIndex = 0;
    showCurrentPlayer();
}

function showCurrentPlayer() {
    const container = document.getElementById('roleReveal');
    
    if (currentIndex >= gameState.players.length) {
        container.innerHTML = `
            <div class="text-center">
                <h3 class="text-xl sm:text-2xl font-bold mb-3 sm:mb-4">All roles are assigned!</h3>
                <p class="text-base sm:text-lg text-gray-600">
                    The game can now begin, remember your role and don't reveal it to others.
                </p>
            </div>
        `;
        return;
    }
    
    const player = gameState.players[currentIndex];
    const isImposter = player.role === 'imposter';
    const isJester = player.role === 'jester';
    
    let roleDisplay = '';
    
    if (isImposter) {
        roleDisplay = `
            <div class="text-5xl sm:text-6xl mb-3 sm:mb-4">
                <i class="fas fa-skull text-red-600"></i>
            </div>
            <div class="text-2xl sm:text-3xl font-bold mb-4 sm:mb-6 text-red-600">
                IMPOSTER
            </div>
            <p class="text-base sm:text-lg text-red-600">Eliminate all crewmates to win!</p>
            <p class="text-sm sm:text-base text-gray-500 mt-3 sm:mt-4">You don't know the secret word</p>
        `;
    } else if (isJester) {
        const jesterInfo = getJesterWordInfo(gameState.secretWord, gameState.wordCategory, gameState.jesterInfo);
        roleDisplay = `
            <div class="text-5xl sm:text-6xl mb-3 sm:mb-4">
                <i class="fas fa-masks-theater text-green-600"></i>
            </div>
            <div class="text-2xl sm:text-3xl font-bold mb-4 sm:mb-6 text-green-600">
                JESTER
            </div>
            <p class="text-base sm:text-lg text-green-600">Get voted out to win!</p>
            <div class="bg-yellow-100 rounded-lg p-3 sm:p-4 mt-3 sm:mt-4">
                <p class="text-sm sm:text-base text-yellow-800 font-semibold">${jesterInfo}</p>
            </div>
        `;
    } else {
        roleDisplay = `
            <div class="text-5xl sm:text-6xl mb-3 sm:mb-4">
                <i class="fas fa-user-astronaut text-blue-600"></i>
            </div>
            <div class="text-2xl sm:text-3xl font-bold mb-6 sm:mb-8 text-blue-600">
                CREWMATE
            </div>
            <div class="bg-blue-100 rounded-lg p-4 sm:p-6 mt-4 sm:mt-6">
                <p class="text-lg sm:text-xl text-blue-600 mb-3">Secret Word:</p>
                <div class="text-2xl sm:text-3xl font-bold text-blue-600 pulse-word mb-3">${gameState.secretWord}</div>
                <p class="text-sm sm:text-base text-blue-600">Use this to identify other crewmates</p>
            </div>
        `;
    }
    
    container.innerHTML = `
        <div class="slide-in">
            <div id="playerHeader">
                <h3 class="text-xl sm:text-2xl font-bold mb-3 sm:mb-4">${player.name}</h3>
                <p class="text-base sm:text-lg mb-4 sm:mb-6 text-gray-600 px-2">Pass device to ${player.name} and click below to reveal their role:</p>
                <button onclick="revealRole()" class="btn bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg mb-4 sm:mb-6 w-full sm:w-auto">
                    <i class="fas fa-eye"></i> Reveal Role
                </button>
            </div>
            <div id="roleDisplay" class="hidden">
                ${roleDisplay}
                <button onclick="nextPlayer()" class="btn bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg mt-4 w-full sm:w-auto">
                    <i class="fas fa-arrow-right"></i> Next Player
                </button>
            </div>
        </div>
    `;
}

function revealRole() {
    document.getElementById('playerHeader').classList.add('hidden');
    document.getElementById('roleDisplay').classList.remove('hidden');
}

function nextPlayer() {
    currentIndex++;
    showCurrentPlayer();
}

showCurrentPlayer();
</script>
{% endblock %}
